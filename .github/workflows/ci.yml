name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vss_compile:
        description: 'Compile the isolated VSS requester without executing it'
        type: boolean
        required: false
        default: false
      vss_volume:
        description: 'Explicitly create a 1 GiB NTFS / 512 MiB VSS fixture (approved maximum 4 GiB)'
        type: boolean
        required: false
        default: false
      refs_volume:
        description: 'Explicitly create a disposable 4 GiB ReFS VHDX for this run'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  check:
    if: ${{ !inputs.vss_compile && !inputs.vss_volume }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test ordinary and fallback paths
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Test actual APFS clones and isolation
        if: runner.os == 'macOS'
        env:
          SPRIG_REQUIRE_REFLINK: '1'
        run: cargo test --locked
      - name: Inspect existing Windows volumes for ReFS coverage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "Image: $env:ImageOS $env:ImageVersion; OS: $([Environment]::OSVersion.VersionString)"
          $volumes = @(Get-Volume)
          $volumes | Select-Object DriveLetter, FileSystem, FileSystemType, AllocationUnitSize, SizeRemaining, HealthStatus | ConvertTo-Json
          $refs = $volumes | Where-Object { $_.FileSystem -eq 'ReFS' -and $_.DriveLetter -and $_.HealthStatus -eq 'Healthy' } | Select-Object -First 1
          if ($refs) {
            "SPRIG_REFS_TEST_ROOT=$($refs.DriveLetter):\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Output 'ReFS clone runtime coverage unavailable: no existing healthy drive-letter ReFS volume. No volume is created or formatted.'
          }
      - name: Test Windows native-copy semantics
        if: runner.os == 'Windows'
        run: cargo test --locked
      - name: Explicit synthetic ReFS runtime validation
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.refs_volume
        shell: pwsh
        run: ./tests/refs_vhd_workflow.ps1 -AllowSyntheticVolume
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.refs_volume
        with:
          name: refs-runtime-result
          path: |
            ${{ runner.temp }}/sprig-refs-*/result.json
            ${{ runner.temp }}/sprig-refs-*/diskpart.log
          if-no-files-found: warn
      - name: Build optimized example binary
        if: runner.os != 'Windows'
        run: cargo build --release --locked
      - name: Run reproducible effects comparison
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=(--require-clone)
          fi
          python3 examples/compare.py --binary target/release/sprig "${args[@]}"

  projection:
    if: ${{ !inputs.vss_compile && !inputs.vss_volume }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo clippy --locked --all-targets --features projection -- -D warnings
      - run: cargo test --locked --features projection
      - run: cargo build --locked --features projection
      - name: Verify rootful projection lifecycle on synthetic data
        shell: bash
        run: |
          sudo modprobe fuse
          sudo modprobe overlay
          test -c /dev/fuse
          set -o pipefail
          sudo python3 tests/projection_workflow.py --binary "$PWD/target/debug/sprig" | tee projection-result.json
      - name: Verify owned writable CAS lifecycle on synthetic data
        shell: bash
        run: |
          set -o pipefail
          sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" python3 tests/writable_workflow.py --binary "$PWD/target/debug/sprig" | tee writable-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projection-result
          path: |
            projection-result.json
            writable-result.json
          if-no-files-found: ignore

  vss_experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.vss_compile || inputs.vss_volume) }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and compile the isolated requester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.refs_volume }}' -eq 'true' -or ('${{ inputs.vss_compile }}' -eq 'true' -and '${{ inputs.vss_volume }}' -eq 'true')) { throw 'Choose exactly one isolated experiment mode.' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'experiments\windows-vss'
          python -m py_compile "$source\fixture.py" "$source\cargo_fixture.py"
          if ($LASTEXITCODE -ne 0) { throw 'Python source validation failed.' }
          python "$source\cargo_fixture.py" selftest
          if ($LASTEXITCODE -ne 0) { throw 'Bounded Cargo oracle selftest failed.' }
          $tokens = $null; $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile("$source\run_vss_fixture.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $rootEntry = '{"status":"passed","entries":{"":{"kind":"directory"}}}' | ConvertFrom-Json -AsHashtable
          if ($rootEntry.status -ne 'passed' -or $rootEntry.entries[''].kind -ne 'directory') { throw 'Empty relative-root JSON key was not preserved.' }
          $pathGuard = $ast.Find({ param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Assert-PlainPath' }, $false)
          if ($null -eq $pathGuard) { throw 'Path guard missing.' }
          . ([scriptblock]::Create($pathGuard.Extent.Text))
          Set-StrictMode -Version Latest
          Assert-PlainPath "$source\run_vss_fixture.ps1"
          Assert-PlainPath $source
          Assert-PlainPath ([IO.Path]::GetPathRoot($source))
          $fileResolver = $ast.Find({ param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Resolve-LocalFile' }, $false)
          if ($null -eq $fileResolver) { throw 'File resolver missing.' }
          . ([scriptblock]::Create($fileResolver.Extent.Text))
          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $resolvedPython = Resolve-LocalFile $pythonCommand.Source
          if ($resolvedPython -isnot [string]) { throw 'Python resolution must produce one existing file.' }
          $pump = [regex]::Match((Get-Content "$source\run_vss_fixture.ps1" -Raw), "(?s)Add-Type -TypeDefinition @'\r?\n(.*?)\r?\n'@")
          if (-not $pump.Success) { throw 'Bounded pump source missing.' }
          Add-Type -TypeDefinition $pump.Groups[1].Value
          $inputBytes = [byte[]]::new(1048593)
          $inputStream = [IO.MemoryStream]::new($inputBytes)
          $outputStream = [IO.MemoryStream]::new()
          $probe = [SprigVssBoundedLog]::DrainAsync($inputStream, $outputStream, 1024).GetAwaiter().GetResult()
          if ($probe.TotalBytes -ne $inputBytes.Length -or $probe.WrittenBytes -ne 1024 -or -not $probe.Overflow -or $probe.WriteError -or $outputStream.Length -ne 1024) { throw 'Bounded log pump selftest failed.' }
          $inputStream.Dispose(); $outputStream.Dispose()
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs -or $LASTEXITCODE -ne 0) { throw 'Existing C++ toolchain unavailable; no installation attempted.' }
          $output = Join-Path $env:RUNNER_TEMP ('sprig-vss-build-' + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $output) { throw 'Build directory already exists.' }
          New-Item -ItemType Directory -Path $output | Out-Null
          "SPRIG_VSS_BUILD=$output" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $command = 'call "' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && cl /nologo /Bv /W4 /EHsc /std:c++17 /DUNICODE /D_UNICODE /DSPRIG_VSS_ENABLE_RUNTIME=1 "' + $source + '\vss_requester.cpp" /Fe:"' + $output + '\requester.exe" /Fo:"' + $output + '\requester.obj" /link VssApi.lib Ole32.lib OleAut32.lib Advapi32.lib'
          & $env:ComSpec /d /c $command 2>&1 | Tee-Object -FilePath "$output\compile.log"
          if ($LASTEXITCODE -ne 0) { throw 'Requester compilation failed.' }
          Get-FileHash "$output\requester.exe" -Algorithm SHA256 | Select-Object Algorithm, Hash | ConvertTo-Json | Set-Content "$output\compile-result.json"
      - name: Build the existing Sprig CLI only for explicit runtime acceptance
        if: inputs.vss_volume
        run: |
          cargo test --locked --features vss-experiment --lib stream_import_tests
          if ($LASTEXITCODE -ne 0) { throw 'Stream publication regression failed.' }
          cargo test --locked --features vss-experiment --lib vss_experiment
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot reader regression failed.' }
          cargo build --release --locked --features vss-experiment
          if ($LASTEXITCODE -ne 0) { throw 'Experimental CLI build failed.' }
      - name: Run the explicitly approved synthetic storage snapshot acceptance
        if: inputs.vss_volume
        shell: pwsh
        run: |
          ./experiments/windows-vss/run_vss_fixture.ps1 -AllowSyntheticVolume -CargoWorkload -Requester "$env:SPRIG_VSS_BUILD\requester.exe" -Sprig "$env:GITHUB_WORKSPACE\target\release\sprig.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vss-experiment-evidence
          path: |
            ${{ runner.temp }}/sprig-vss-build-*/compile.log
            ${{ runner.temp }}/sprig-vss-build-*/compile-result.json
            ${{ runner.temp }}/sprig-vss-evidence-*/result.json
            ${{ runner.temp }}/sprig-vss-evidence-*/*.log
            ${{ runner.temp }}/sprig-vss-evidence-*/capture-*.json
            ${{ runner.temp }}/sprig-vss-evidence-*/cargo-prepare.json
            ${{ runner.temp }}/sprig-vss-evidence-*/cargo-finalize.json
          if-no-files-found: warn
