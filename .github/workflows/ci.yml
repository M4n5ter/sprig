name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test ordinary and fallback paths
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Test actual APFS clones and isolation
        if: runner.os == 'macOS'
        env:
          SPRIG_REQUIRE_REFLINK: '1'
        run: cargo test --locked
      - name: Build optimized example binary
        run: cargo build --release --locked
      - name: Run reproducible effects comparison
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=(--require-clone)
          fi
          python3 examples/compare.py --binary target/release/sprig "${args[@]}"
