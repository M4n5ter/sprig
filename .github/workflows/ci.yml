name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_probe:
        description: Explicit disposable guest signing and RAM mapping experiment
        type: boolean
        required: false
        default: false
      ewdk_build:
        description: Explicit isolated EWDK build-only validation without driver loading
        type: boolean
        required: false
        default: false
      guest_boot:
        description: Explicit one-time isolated Windows Server evaluation guest boot test
        type: boolean
        required: false
        default: false
      runner_probe:
        description: Read-only Windows virtualization and diagnostic capability probe
        type: boolean
        required: false
        default: false
      refs_volume:
        description: 'Explicitly create a disposable 4 GiB ReFS VHDX for this run'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  check:
    if: ${{ !inputs.runner_probe && !inputs.guest_boot && !inputs.ewdk_build && !inputs.kernel_probe }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test ordinary and fallback paths
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Test actual APFS clones and isolation
        if: runner.os == 'macOS'
        env:
          SPRIG_REQUIRE_REFLINK: '1'
        run: cargo test --locked
      - name: Inspect existing Windows volumes for ReFS coverage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "Image: $env:ImageOS $env:ImageVersion; OS: $([Environment]::OSVersion.VersionString)"
          $volumes = @(Get-Volume)
          $volumes | Select-Object DriveLetter, FileSystem, FileSystemType, AllocationUnitSize, SizeRemaining, HealthStatus | ConvertTo-Json
          $refs = $volumes | Where-Object { $_.FileSystem -eq 'ReFS' -and $_.DriveLetter -and $_.HealthStatus -eq 'Healthy' } | Select-Object -First 1
          if ($refs) {
            "SPRIG_REFS_TEST_ROOT=$($refs.DriveLetter):\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Output 'ReFS clone runtime coverage unavailable: no existing healthy drive-letter ReFS volume. No volume is created or formatted.'
          }
      - name: Test Windows native-copy semantics
        if: runner.os == 'Windows'
        run: cargo test --locked
      - name: Explicit synthetic ReFS runtime validation
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.refs_volume
        shell: pwsh
        run: ./tests/refs_vhd_workflow.ps1 -AllowSyntheticVolume
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.refs_volume
        with:
          name: refs-runtime-result
          path: |
            ${{ runner.temp }}/sprig-refs-*/result.json
            ${{ runner.temp }}/sprig-refs-*/diskpart.log
          if-no-files-found: warn
      - name: Build optimized example binary
        if: runner.os != 'Windows'
        run: cargo build --release --locked
      - name: Run reproducible effects comparison
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=(--require-clone)
          fi
          python3 examples/compare.py --binary target/release/sprig "${args[@]}"

  projection:
    if: ${{ !inputs.runner_probe && !inputs.guest_boot && !inputs.ewdk_build && !inputs.kernel_probe }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo clippy --locked --all-targets --features projection -- -D warnings
      - run: cargo test --locked --features projection
      - run: cargo build --locked --features projection
      - name: Verify rootful projection lifecycle on synthetic data
        shell: bash
        run: |
          sudo modprobe fuse
          sudo modprobe overlay
          test -c /dev/fuse
          set -o pipefail
          sudo python3 tests/projection_workflow.py --binary "$PWD/target/debug/sprig" | tee projection-result.json
      - name: Verify owned writable CAS lifecycle on synthetic data
        shell: bash
        run: |
          set -o pipefail
          sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" python3 tests/writable_workflow.py --binary "$PWD/target/debug/sprig" | tee writable-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projection-result
          path: |
            projection-result.json
            writable-result.json
          if-no-files-found: ignore

  windows-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.runner_probe && !inputs.guest_boot && !inputs.ewdk_build && !inputs.kernel_probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read existing runner capabilities without changing configuration
        shell: pwsh
        run: ./tests/windows_runner_probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runner-capabilities
          path: runner-capabilities.json
          if-no-files-found: error

  windows-guest-boot:
    if: github.event_name == 'workflow_dispatch' && inputs.guest_boot && !inputs.runner_probe && !inputs.refs_volume && !inputs.ewdk_build && !inputs.kernel_probe
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Parse the isolated guest test before any execution
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tests/windows_guest_boot.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Explicitly install and boot only the isolated evaluation guest
        shell: pwsh
        run: ./tests/windows_guest_boot.ps1 -AllowGuestBoot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-guest-boot-result
          path: |
            guest-boot-result.json
            guest-boot-events.json
          if-no-files-found: error

  windows-ewdk-build:
    if: github.event_name == 'workflow_dispatch' && inputs.ewdk_build && !inputs.kernel_probe && !inputs.guest_boot && !inputs.runner_probe && !inputs.refs_volume
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Parse build-only scripts before downloading tools
        shell: pwsh
        run: |
          foreach ($file in @('windows_ewdk_build.ps1', 'windows_ewdk_compile.ps1', 'windows_signing_guard_smoke.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tests/$file", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
      - name: Validate generated signing guards before downloading the EWDK
        shell: pwsh
        run: ./tests/windows_signing_guard_smoke.ps1
      - name: Compile fixed baseline and isolated experiment without running outputs
        shell: pwsh
        run: ./tests/windows_ewdk_build.ps1 -AllowBuildOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ewdk-build-result
          path: |
            ewdk-result.json
            ewdk-compile-result.json
            ewdk-logs/*.txt
          if-no-files-found: error

  windows-kernel-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.kernel_probe && !inputs.ewdk_build && !inputs.guest_boot && !inputs.runner_probe && !inputs.refs_volume
    runs-on: windows-2025
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - name: Parse all scripts before downloads or guest changes
        shell: pwsh
        run: |
          foreach ($file in @('windows_ewdk_build.ps1', 'windows_ewdk_compile.ps1', 'windows_signing_guard_smoke.ps1', 'windows_guest_boot.ps1', 'windows_guest_probe_payload.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tests/$file", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
      - name: Validate signing veto for the host-side build
        shell: pwsh
        run: ./tests/windows_signing_guard_smoke.ps1
      - name: Build the exact guest payload without host execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $payload='D:\sprig-kernel-payload-'+[Guid]::NewGuid().ToString('N')
          ./tests/windows_ewdk_build.ps1 -AllowBuildOnly -GuestPayloadDirectory $payload
          # Only successful export proves caller ownership for later cleanup.
          "SPRIG_PROBE_PAYLOAD=$payload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the signed experiment only inside the isolated guest
        shell: pwsh
        run: ./tests/windows_guest_boot.ps1 -AllowGuestBoot -AllowKernelProbe -KernelPayloadDirectory $env:SPRIG_PROBE_PAYLOAD
      - name: Remove only this successfully exported payload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:SPRIG_PROBE_PAYLOAD) {
            $payload=$env:SPRIG_PROBE_PAYLOAD
            if($payload -notmatch '^D:\\sprig-kernel-payload-[0-9a-f]{32}$') { throw 'Payload cleanup identity invalid.' }
            if(Test-Path -LiteralPath $payload) {
              if((Get-Item -LiteralPath $payload).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Payload cleanup refused reparse point.' }
              Remove-Item -LiteralPath $payload -Recurse -Force
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-probe-result
          path: |
            ewdk-result.json
            ewdk-compile-result.json
            ewdk-logs/*.txt
            guest-boot-result.json
            guest-boot-events.json
          if-no-files-found: error
