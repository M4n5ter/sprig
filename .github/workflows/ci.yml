name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test ordinary and fallback paths
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Test actual APFS clones and isolation
        if: runner.os == 'macOS'
        env:
          SPRIG_REQUIRE_REFLINK: '1'
        run: cargo test --locked
      - name: Test Windows native-copy semantics
        if: runner.os == 'Windows'
        run: cargo test --locked
      - name: Build optimized example binary
        if: runner.os != 'Windows'
        run: cargo build --release --locked
      - name: Run reproducible effects comparison
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=(--require-clone)
          fi
          python3 examples/compare.py --binary target/release/sprig "${args[@]}"

  projection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo clippy --locked --all-targets --features projection -- -D warnings
      - run: cargo test --locked --features projection
      - run: cargo build --locked --features projection
      - name: Verify rootful projection lifecycle on synthetic data
        shell: bash
        run: |
          sudo modprobe fuse
          sudo modprobe overlay
          test -c /dev/fuse
          set -o pipefail
          sudo python3 tests/projection_workflow.py --binary "$PWD/target/debug/sprig" | tee projection-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projection-result
          path: projection-result.json
          if-no-files-found: ignore
