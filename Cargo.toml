[package]
name = "sprig"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Small native-filesystem workspace snapshots"
publish = false
license = "MIT"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[features]
default = []
projection = ["dep:fuser"]
windows-mount = ["dep:winfsp_wrs", "dep:windows-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.16.0", optional = true, default-features = false, features = ["abi-7-31"] }

[target.'cfg(windows)'.dependencies]
winfsp_wrs = { version = "=0.4.0", optional = true }
windows-sys = { version = "=0.52.0", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Win32_System_LibraryLoader"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
fastcdc = "3"
libc = "0.2"
diffy = "0.4"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
zstd = { version = "0.13", default-features = false }
